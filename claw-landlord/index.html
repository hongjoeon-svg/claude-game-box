<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : 아이폰 노치/홈 인디케이터 영역까지 화면을 쓰고 safe-area 로 여백 처리 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#2a1640" />
    <title>뽑기방 건물주</title>
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div class="pill coins"><span class="coin-icon"></span><span id="coinText">0</span></div>
        <div class="pill caught">🧸 <span id="caughtText">0</span></div>
        <button id="muteBtn" class="icon-btn" aria-label="소리 켜기/끄기">🔊</button>
      </header>

      <main id="stage">
        <canvas id="game"></canvas>
      </main>

      <footer id="controls">
        <div id="lever" aria-label="집게 이동 레버">
          <div class="track">
            <span class="arrow left">◀</span>
            <span class="arrow right">▶</span>
            <div class="knob"><div class="knob-ball"></div></div>
          </div>
          <div class="lever-hint">레버를 좌우로 밀어 집게 이동</div>
        </div>
        <button id="dropBtn" aria-label="뽑기">
          <span class="drop-label">뽑기!</span>
        </button>
      </footer>
    </div>

    <div id="rotate">📱 세로로 돌려 주세요</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
