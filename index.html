<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b16">
<title>클로드 게임 모음집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  /* 우주·사이버 무드: 다크 네이비 그라데이션 + 은은한 그리드·별빛, 네온 오렌지→핑크→퍼플 포인트, 유리 카드 */
  :root {
    color-scheme: dark;
    --bg0: #090b16;
    --bg1: #11162b;
    --text: #f5f6ff;
    --sub: #a7adc8;
    --dim: #7b81a0;
    --glass: rgba(22, 27, 52, .55);
    --glassHi: rgba(32, 38, 72, .7);
    --line: rgba(255, 255, 255, .09);
    --orange: #ff8a3d;
    --pink: #ff4fb8;
    --purple: #a855f7;
    --font: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: var(--font); color: var(--text);
    background:
      radial-gradient(900px 520px at 50% -8%, #3a1d6e55, transparent 65%),
      radial-gradient(700px 500px at 100% 30%, #7a1f6a26, transparent 60%),
      radial-gradient(800px 600px at -5% 80%, #1d3a8a33, transparent 60%),
      linear-gradient(180deg, var(--bg0), var(--bg1) 55%, var(--bg0));
    background-attachment: fixed;
    overflow-x: hidden; -webkit-tap-highlight-color: transparent;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  :focus-visible { outline: 2px solid #ff9de0; outline-offset: 3px; }

  /* ---------- 배경: 그리드 + 별빛 ---------- */
  .space { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .space::before {
    content: ""; position: absolute; inset: -2px;
    background-image:
      linear-gradient(rgba(140, 150, 255, .06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(140, 150, 255, .06) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, #0008 45%, transparent 85%);
            mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, #0008 45%, transparent 85%);
  }
  .space::after {
    content: ""; position: absolute; right: -6%; top: 4%; width: 46vw; height: 46vw; max-width: 620px; max-height: 620px;
    background-image:
      linear-gradient(rgba(255, 79, 184, .09) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 79, 184, .09) 1px, transparent 1px);
    background-size: 40px 40px;
    -webkit-mask-image: radial-gradient(circle at 70% 30%, #000, transparent 70%);
            mask-image: radial-gradient(circle at 70% 30%, #000, transparent 70%);
  }
  .star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; opacity: .5; animation: twinkle var(--d, 4s) ease-in-out infinite; animation-delay: var(--del, 0s); }
  .star.big { width: 3px; height: 3px; box-shadow: 0 0 6px #fff; }
  @keyframes twinkle { 0%, 100% { opacity: .15; transform: scale(.8); } 50% { opacity: .9; transform: scale(1.1); } }

  /* ---------- 헤더 ---------- */
  .wrap { position: relative; z-index: 1; max-width: 1340px; margin: 0 auto; padding: 0 20px 56px; }
  header { text-align: center; padding: 54px 0 10px; }
  .logo { width: 72px; height: 72px; margin: 0 auto 18px; filter: drop-shadow(0 0 10px #ff5fa088) drop-shadow(0 0 26px #a855f766); animation: spin 18s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 {
    font-size: clamp(32px, 5.2vw, 54px); font-weight: 900; letter-spacing: -.02em; line-height: 1.15;
    background: linear-gradient(92deg, #ffb070 0%, var(--orange) 18%, var(--pink) 52%, #c77dff 80%, var(--purple) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(255, 79, 184, .38)) drop-shadow(0 0 40px rgba(168, 85, 247, .25));
  }
  .tagline { color: var(--sub); margin-top: 12px; font-size: clamp(14px, 1.6vw, 17px); }

  /* ---------- 필터 탭 ---------- */
  .tabs { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 34px 0 30px; }
  .tab {
    position: relative; padding: 11px 26px; border-radius: 999px; font-weight: 700; font-size: 16px; color: #d6daf0;
    background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .14);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), 0 6px 18px rgba(0, 0, 0, .25);
    transition: transform .15s, background .2s, border-color .2s, box-shadow .25s, color .2s;
  }
  .tab:hover { transform: translateY(-2px); background: rgba(255, 255, 255, .1); color: #fff; }
  .tab .n { font-size: 12px; font-weight: 700; margin-left: 6px; opacity: .6; }
  .tab[aria-selected="true"] {
    color: #fff; border-color: rgba(255, 170, 230, .7);
    background: linear-gradient(120deg, #7c3aed, #c026d3 55%, #ff4fb8);
    box-shadow: 0 0 0 1px rgba(255, 120, 220, .35), 0 0 18px rgba(214, 70, 230, .55), 0 0 42px rgba(168, 85, 247, .35), inset 0 1px 0 rgba(255, 255, 255, .35);
  }
  .tab[aria-selected="true"] .n { opacity: .9; }

  /* ---------- 카드 그리드 ---------- */
  .grid { display: grid; gap: 20px; grid-template-columns: 1fr; }
  @media (min-width: 480px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 16px; } }
  @media (min-width: 760px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 20px; } }
  @media (min-width: 1020px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  @media (min-width: 1260px) { .grid { grid-template-columns: repeat(5, 1fr); } }

  .card {
    --c: #a855f7; position: relative; display: flex; flex-direction: column; border-radius: 20px; overflow: hidden;
    background: linear-gradient(180deg, rgba(30, 36, 70, .62), rgba(16, 20, 40, .6));
    border: 1px solid var(--line);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), 0 14px 30px rgba(0, 0, 0, .35);
    transition: transform .25s cubic-bezier(.2,.8,.2,1), border-color .25s, box-shadow .25s, opacity .22s ease, scale .22s ease;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-8px);
    border-color: color-mix(in srgb, var(--c) 85%, white 15%);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 60%, transparent), 0 0 22px color-mix(in srgb, var(--c) 45%, transparent), 0 0 60px color-mix(in srgb, var(--c) 22%, transparent), 0 22px 40px rgba(0, 0, 0, .45);
    outline: none;
  }
  .card.out { opacity: 0; scale: .94; }
  .card[hidden] { display: none; }

  /* 상단 일러스트 */
  .art {
    position: relative; height: 150px; overflow: hidden; display: grid; place-items: center;
    background:
      radial-gradient(120% 90% at 50% 110%, color-mix(in srgb, var(--c) 40%, transparent), transparent 60%),
      radial-gradient(60% 70% at 20% 0%, color-mix(in srgb, var(--c) 22%, transparent), transparent 70%),
      linear-gradient(180deg, rgba(255, 255, 255, .02), rgba(0, 0, 0, .1));
    border-bottom: 1px solid var(--line);
  }
  .art::before { /* 바닥 원근 그리드 */
    content: ""; position: absolute; left: -20%; right: -20%; bottom: -40%; height: 80%;
    background-image: linear-gradient(color-mix(in srgb, var(--c) 30%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--c) 30%, transparent) 1px, transparent 1px);
    background-size: 26px 26px; transform: perspective(220px) rotateX(62deg); opacity: .35;
    -webkit-mask-image: linear-gradient(transparent, #000 60%); mask-image: linear-gradient(transparent, #000 60%);
  }
  .orb { /* 입체 원형 백드롭 */
    position: absolute; width: 104px; height: 104px; border-radius: 50%; left: 50%; top: 50%; transform: translate(-30%, -52%);
    background: radial-gradient(circle at 32% 28%, color-mix(in srgb, var(--c) 30%, white 70%), var(--c) 38%, color-mix(in srgb, var(--c) 40%, #0b0e22) 100%);
    box-shadow: 0 0 34px color-mix(in srgb, var(--c) 70%, transparent), inset -10px -14px 24px rgba(0, 0, 0, .35);
    opacity: .9;
  }
  .tile { /* 입체 카드형 백드롭 */
    position: absolute; width: 70px; height: 70px; border-radius: 18px; left: 50%; top: 50%; transform: translate(-115%, -38%) rotate(-12deg);
    background: linear-gradient(145deg, rgba(255, 255, 255, .28), rgba(255, 255, 255, .05));
    border: 1px solid rgba(255, 255, 255, .3); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 10px 24px rgba(0, 0, 0, .35);
  }
  .emo { position: relative; font-size: 62px; line-height: 1; transform: translate(14px, -4px); filter: drop-shadow(0 8px 10px rgba(0, 0, 0, .45)) drop-shadow(0 0 16px color-mix(in srgb, var(--c) 55%, transparent)); transition: transform .3s cubic-bezier(.2,1.4,.4,1); }
  .emo2 { position: absolute; left: 50%; top: 50%; transform: translate(-128%, -36%) rotate(-12deg); font-size: 36px; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .4)); transition: transform .3s cubic-bezier(.2,1.4,.4,1); }
  .card:hover .emo { transform: translate(14px, -10px) scale(1.08) rotate(-4deg); }
  .card:hover .emo2 { transform: translate(-138%, -44%) rotate(-20deg); }

  /* 본문 */
  .body { padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .body h2 { font-size: 18px; font-weight: 900; color: #fff; line-height: 1.3; letter-spacing: -.01em; }
  .body p { font-size: 13.5px; line-height: 1.6; color: var(--sub); flex: 1; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .bdg { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; color: #cfd3ea; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .1); white-space: nowrap; }
  .bdg.ppl { color: #fff; background: color-mix(in srgb, var(--c) 30%, transparent); border-color: color-mix(in srgb, var(--c) 60%, transparent); }
  .how { font-size: 12.5px; color: var(--dim); line-height: 1.5; padding-top: 10px; border-top: 1px solid var(--line); }

  .empty { text-align: center; color: var(--sub); padding: 40px 0; }
  footer { position: relative; z-index: 1; text-align: center; color: #646a88; font-size: 13px; line-height: 1.7; padding: 0 20px 40px; }

  @media (max-width: 479px) {
    .art { height: 140px; }
    .tab { padding: 10px 18px; font-size: 15px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
</style>
</head>

  { id: 'synchro', cats: ['3', 'party'], c: '#ff5e8a', emoji: '🎯', emo2: '💞', name: 'Synchro 100', ppl: '단체', extra: ['💞 이심전심'],
    desc: '15초 안에 모두와 같은 단어를! 단체 모임용 이심전심 파티 게임', how: '진행자 화면으로 이동 · 외부 서버', url: 'https://synchro100.onrender.com/host' },
  { id: 'sumolseon', cats: ['1', '2', '3'], c: '#ffb547', emoji: '🕯️', emo2: '🏚️', name: '수몰선: 마지막 동창회', ppl: '5인', extra: ['🤖 빈자리는 AI 봇', '🕵️ 머더미스터리'],
    desc: '내일 정오, 마을이 물에 잠긴다. 5인 실시간 머더미스터리', how: '첫 접속은 서버가 깨어나는 데 1분쯤 걸려요', url: 'https://sumolseon.onrender.com' },
  { id: 'nightshift', cats: ['1'], c: '#7c83ff', emoji: '🌙', emo2: '🚪', name: '끝나지 않는 야간 근무', ppl: '1인', extra: ['🎧 공포'],
    desc: '끝없이 이어지는 매장 속에서 비상구를 찾아 탈출하라', how: '새 창에서 열려요 · 외부 서버', url: 'https://endless-night-shift.onrender.com' },
];
const TABS = [
  { id: 'all', label: '전체' },
  { id: '1', label: '1인' },
  { id: '2', label: '2인' },
  { id: '3', label: '3인+' },
  { id: 'party', label: '단체/파티' },
];
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// 별빛
(() => {
  const sp = $('space'), n = innerWidth < 600 ? 45 : 90;
  let h = '';
  for (let i = 0; i < n; i++) {
    h += `<i class="star${Math.random() < .12 ? ' big' : ''}" style="left:${(Math.random() * 100).toFixed(2)}%;top:${(Math.random() * 100).toFixed(2)}%;--d:${(3 + Math.random() * 5).toFixed(1)}s;--del:${(-Math.random() * 6).toFixed(1)}s"></i>`;
  }
  sp.innerHTML = h;
})();

// 카드
$('grid').innerHTML = GAMES.map(g => `
  <a class="card" data-id="${g.id}" style="--c:${g.c}" href="${esc(g.url)}" target="_blank" rel="noopener">
    <div class="art" aria-hidden="true"><span class="orb"></span><span class="tile"></span><span class="emo2">${g.emo2}</span><span class="emo">${g.emoji}</span></div>
    <div class="body">
      <h2>${esc(g.name)}</h2>
      <p>${esc(g.desc)}</p>
      <div class="badges"><span class="bdg ppl">👥 ${esc(g.ppl)}</span>${g.extra.map(x => `<span class="bdg">${esc(x)}</span>`).join('')}</div>
      <div class="how">${esc(g.how)}</div>
    </div>
  </a>`).join('');

// 탭
const count = id => id === 'all' ? GAMES.length : GAMES.filter(g => g.cats.includes(id)).length;
$('tabs').innerHTML = TABS.map(t => `<button class="tab" role="tab" data-tab="${t.id}" aria-selected="false">${t.label}<span class="n">${count(t.id)}</span></button>`).join('');

let current = null, timer = 0;
function select(id, animate = true) {
  if (id === current) return;
  current = id;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === id)));
  try { localStorage.setItem('gamebox-tab', id); } catch (e) {}
  const cards = [...document.querySelectorAll('.card')];
  const want = c => id === 'all' || GAMES.find(g => g.id === c.dataset.id).cats.includes(id);
  clearTimeout(timer);
  const apply = () => {
    let shown = 0;
    cards.forEach(c => {
      const ok = want(c);
      c.hidden = !ok;
      if (ok) { shown++; c.classList.add('out'); }
    });
    $('empty').hidden = shown > 0;
    requestAnimationFrame(() => requestAnimationFrame(() => cards.forEach((c, i) => {
      if (c.hidden) return;
      c.style.transitionDelay = animate && !reduce ? `${Math.min(i, 8) * 30}ms` : '0ms';
      c.classList.remove('out');
    })));
    // 등장 지연은 호버 반응에 남지 않도록 지움
    setTimeout(() => cards.forEach(c => { c.style.transitionDelay = ''; }), 600);
  };
  if (!animate || reduce) { apply(); return; }
  cards.forEach(c => { c.style.transitionDelay = '0ms'; if (!c.hidden) c.classList.add('out'); });
  timer = setTimeout(apply, 200);
}
$('tabs').onclick = e => { const b = e.target.closest('.tab'); if (b) select(b.dataset.tab); };
$('tabs').onkeydown = e => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const ids = TABS.map(t => t.id), i = ids.indexOf(current);
  const next = ids[(i + (e.key === 'ArrowRight' ? 1 : ids.length - 1)) % ids.length];
  select(next); document.querySelector(`.tab[data-tab="${next}"]`).focus();
};
let saved = 'all';
try { const v = localStorage.getItem('gamebox-tab'); if (TABS.some(t => t.id === v)) saved = v; } catch (e) {}
select(saved, false);
</script>
</body>
</html>
