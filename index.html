<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>클로드 게임 모음집</title>
<style>
  :root {
    --bg: #1a1714;
    --panel: #26211d;
    --panel2: #312a25;
    --text: #f4ede6;
    --muted: #a99d92;
    --accent: #d97757;
    --accent2: #e8a87c;
    --good: #7fbf7f;
    --bad: #e06c6c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; cursor: pointer; }

  /* ---------- 홈 ---------- */
  header.top {
    text-align: center;
    padding: 48px 16px 24px;
  }
  .logo {
    width: 64px; height: 64px; margin: 0 auto 16px;
    animation: spin 12s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  header.top h1 { font-size: clamp(28px, 6vw, 44px); letter-spacing: -0.02em; }
  header.top h1 span { color: var(--accent); }
  header.top p { color: var(--muted); margin-top: 8px; }

  .grid {
    max-width: 1000px; margin: 0 auto; padding: 16px 16px 64px;
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }
  .card {
    background: var(--panel);
    border: 1px solid #3a322c;
    border-radius: 18px;
    padding: 22px;
    text-align: left;
    color: var(--text);
    transition: transform .15s, border-color .15s, background .15s;
    display: flex; flex-direction: column; gap: 8px;
  }
  a.card { text-decoration: none; }
  .card:hover { transform: translateY(-4px); border-color: var(--accent); background: var(--panel2); }
  .card .emoji { font-size: 40px; }
  .card h2 { font-size: 20px; }
  .card p { color: var(--muted); font-size: 14px; line-height: 1.45; flex: 1; }
  .card .best { font-size: 13px; color: var(--accent2); }
  footer { text-align: center; color: #6f645b; font-size: 12px; padding: 0 16px 32px; }

</style>
</head>
<body>

<!-- ================= 홈 ================= -->
<main id="home">
  <header class="top">
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
      <g fill="#d97757">
        <rect x="46" y="6" width="8" height="38" rx="4"/>
        <rect x="46" y="6" width="8" height="38" rx="4" transform="rotate(45 50 50)"/>
        <rect x="46" y="6" width="8" height="38" rx="4" transform="rotate(90 50 50)"/>
        <rect x="46" y="6" width="8" height="38" rx="4" transform="rotate(135 50 50)"/>
        <rect x="46" y="6" width="8" height="38" rx="4" transform="rotate(180 50 50)"/>
        <rect x="46" y="6" width="8" height="38" rx="4" transform="rotate(225 50 50)"/>
        <rect x="46" y="6" width="8" height="38" rx="4" transform="rotate(270 50 50)"/>
        <rect x="46" y="6" width="8" height="38" rx="4" transform="rotate(315 50 50)"/>
      </g>
    </svg>
    <h1><span>클로드</span> 게임 모음집</h1>
    <p>친구들과, 혹은 혼자서. 브라우저에서 바로 여는 게임</p>
  </header>
  <section class="grid" id="grid"></section>
  <footer>Claude와 함께 만든 게임 모음 · 서버가 잠들어 있으면 처음 열 때 1분쯤 걸려요</footer>
</main>

<script>
const GAMES = [
  { id: 'nosplash', emoji: '🏊', name: '물소리 금지', desc: '1인칭 잠입 공포. 불 꺼진 수영장, 물에 발이 닿는 순간 물속의 구조요원이 튀어나온다. 숙이고, 돌을 던져 따돌리고, 탈출하라', url: 'no-splash.html', tag: '🎧 혼자 · 헤드폰 필수 · 그래픽 무거움 (PC 추천)' },
  { id: 'chickenrun', emoji: '🐔', name: '치킨 런: 멈춰야 산다', desc: '치솟는 배수, 언제 터질지 모르는 닭. 터지기 전에 폰으로 [지금 탈출하기!]를 누르면 배수×100점, 욕심내면 0점. 5라운드 눈치싸움', url: 'chicken-run.html?role=host', tag: '👥 여럿이 · 📱 폰 QR 입장 · 메인 화면(프로젝터)에서 열어요' },
  { id: 'bluffdice', emoji: '🎲', name: '블러핑 다이스 100', desc: '내 주사위는 나만 몰래 엿본다! 20초 동안 콜·레이즈·다이로 눈치싸움, 가장 높은 합계가 판돈 독식. 프로젝터 + 스마트폰 실시간 베팅 파티 게임', url: 'bluffing-dice.html', tag: '👥 여럿이 · 메인 화면(TV/프로젝터)에서 열어요' },
  { id: 'bombrelay', emoji: '💣', name: '시한폭탄 릴레이', desc: '초성에 맞는 단어를 쳐서 폭탄을 넘겨라! 퓨즈가 다 타면 쥐고 있던 사람이 펑. 친구들은 폰으로 QR 입장, 사람이 모자라면 AI와 대결', url: 'bomb-relay.html?role=host', tag: '👥 여럿이 · 🤖 AI와 혼자서도 · 메인 화면(TV)에서 열어요' },
  { id: 'synchro', emoji: '🎯', name: 'Synchro 100', desc: '15초 안에 모두와 같은 단어를! 단체 모임용 이심전심 파티 게임', url: 'https://synchro100.onrender.com/host', tag: '👥 여럿이 · 진행자 화면으로 이동' },
  { id: 'sumolseon', emoji: '🕯️', name: '수몰선: 마지막 동창회', desc: '내일 정오, 마을이 물에 잠긴다. 5인 실시간 머더미스터리 (AI 봇으로 빈자리 채우기 가능)', url: 'https://sumolseon.onrender.com', tag: '👥 5인 · 첫 접속은 서버가 깨어나는 데 1분쯤 걸려요' },
  { id: 'nightshift', emoji: '🌙', name: '끝나지 않는 야간 근무', desc: '끝없이 이어지는 매장 속에서 비상구를 찾아 탈출하라', url: 'https://endless-night-shift.onrender.com', tag: '🎧 혼자 · 새 창에서 열려요' },
];
document.getElementById('grid').innerHTML = GAMES.map(g => `<a class="card" href="${g.url}" target="_blank" rel="noopener">
  <div class="emoji">${g.emoji}</div>
  <h2>${g.name}</h2>
  <p>${g.desc}</p>
  <div class="best">${g.tag}</div>
</a>`).join('');
</script>
</body>
</html>
