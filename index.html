<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>클로드 게임 모음집</title>
<style>
  :root {
    --bg: #1a1714;
    --panel: #26211d;
    --panel2: #312a25;
    --text: #f4ede6;
    --muted: #a99d92;
    --accent: #d97757;
    --accent2: #e8a87c;
    --good: #7fbf7f;
    --bad: #e06c6c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; cursor: pointer; }

  /* ---------- 홈 ---------- */
  header.top {
    text-align: center;
    padding: 48px 16px 24px;
  }
  .logo {
    width: 64px; height: 64px; margin: 0 auto 16px;
    animation: spin 12s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  header.top h1 { font-size: clamp(28px, 6vw, 44px); letter-spacing: -0.02em; }
  header.top h1 span { color: var(--accent); }
  header.top p { color: var(--muted); margin-top: 8px; }

  .grid {
    max-width: 1000px; margin: 0 auto; padding: 16px 16px 64px;
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }
  .card {
    background: var(--panel);
    border: 1px solid #3a322c;
    border-radius: 18px;
    padding: 22px;
    text-align: left;
    color: var(--text);
    transition: transform .15s, border-color .15s, background .15s;
    display: flex; flex-direction: column; gap: 8px;
  }
  a.card { text-decoration: none; }
  .card:hover { transform: translateY(-4px); border-color: var(--accent); background: var(--panel2); }
  .card .emoji { font-size: 40px; }
  .card h2 { font-size: 20px; }
  .card p { color: var(--muted); font-size: 14px; line-height: 1.45; flex: 1; }
  .card .best { font-size: 13px; color: var(--accent2); }
  footer { text-align: center; color: #6f645b; font-size: 12px; padding: 0 16px 32px; }

  /* ---------- 게임 화면 ---------- */
  #game-view { display: none; min-height: 100%; flex-direction: column; align-items: center; padding: 16px; }
  body.playing #home { display: none; }
  body.playing #game-view { display: flex; }
  .bar {
    width: 100%; max-width: 640px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-bottom: 12px;
  }
  .btn {
    background: var(--panel2); color: var(--text);
    border: 1px solid #4a4038; border-radius: 12px;
    padding: 10px 16px;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1714; font-weight: 700; }
  .bar h2 { font-size: 18px; }
  .hud { display: flex; gap: 16px; font-variant-numeric: tabular-nums; color: var(--muted); }
  .hud b { color: var(--text); }
  #stage { width: 100%; max-width: 640px; position: relative; }
  canvas { display: block; width: 100%; border-radius: 16px; background: #120f0d; touch-action: none; }
  .overlay {
    position: absolute; inset: 0; border-radius: 16px;
    background: rgba(18, 15, 13, .82);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    text-align: center; padding: 24px;
  }
  .overlay h3 { font-size: 28px; }
  .overlay p { color: var(--muted); line-height: 1.5; }
  .help { color: var(--muted); font-size: 13px; margin-top: 12px; text-align: center; }

  /* 짝 맞추기 */
  .mem-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .mem-card {
    aspect-ratio: 1; border-radius: 14px; border: none;
    background: var(--panel2); font-size: clamp(28px, 8vw, 48px);
    position: relative; transform-style: preserve-3d; transition: transform .35s;
  }
  .mem-card .f, .mem-card .b {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    border-radius: 14px; backface-visibility: hidden;
  }
  .mem-card .b { background: linear-gradient(135deg, var(--accent), #b85c3e); color: #1a1714; font-size: 24px; }
  .mem-card .f { background: #f4ede6; transform: rotateY(180deg); }
  .mem-card.open { transform: rotateY(180deg); }
  .mem-card.done .f { background: #cfe8cf; }

  /* 반응속도 */
  .react-box {
    width: 100%; aspect-ratio: 4/3; border-radius: 16px; border: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    color: #fff; font-size: 26px; font-weight: 700; user-select: none;
    transition: background .1s;
  }
  .react-box small { font-size: 15px; font-weight: 400; opacity: .85; }

  /* 두더지 */
  .mole-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .hole {
    aspect-ratio: 1; border-radius: 50%; border: none;
    background: radial-gradient(circle at 50% 60%, #0c0a09 55%, #3a2f27 56%);
    position: relative; overflow: hidden; font-size: clamp(36px, 12vw, 64px);
  }
  .hole span {
    position: absolute; left: 0; right: 0; bottom: -100%;
    transition: bottom .12s; display: flex; justify-content: center;
  }
  .hole.up span { bottom: 12%; }
</style>
</head>
<body>

<!-- ================= 홈 ================= -->
<main id="home">
  <header class="top">
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
      <g fill="#d97757">
        <rect x="46" y="6" width="8" height="38" rx="4"/>
        <rect x="46" y="6" width="8" height="38" rx="4" transform="rotate(45 50 50)"/>
        <rect x="46" y="6" width="8" height="38" rx="4" transform="rotate(90 50 50)"/>
        <rect x="46" y="6" width="8" height="38" rx="4" transform="rotate(135 50 50)"/>
        <rect x="46" y="6" width="8" height="38" rx="4" transform="rotate(180 50 50)"/>
        <rect x="46" y="6" width="8" height="38" rx="4" transform="rotate(225 50 50)"/>
        <rect x="46" y="6" width="8" height="38" rx="4" transform="rotate(270 50 50)"/>
        <rect x="46" y="6" width="8" height="38" rx="4" transform="rotate(315 50 50)"/>
      </g>
    </svg>
    <h1><span>클로드</span> 게임 모음집</h1>
    <p>심심할 때 한 판! 브라우저에서 바로 즐기는 미니게임</p>
  </header>
  <section class="grid" id="grid"></section>
  <footer>Claude와 함께 만든 팬메이드 게임 모음 · 최고 기록은 이 브라우저에 저장돼요</footer>
</main>

<!-- ================= 게임 화면 ================= -->
<section id="game-view">
  <div class="bar">
    <button class="btn" id="back">← 목록</button>
    <h2 id="game-title"></h2>
    <div class="hud" id="hud"></div>
  </div>
  <div id="stage"></div>
  <p class="help" id="help"></p>
</section>

<script>
/* ---------- 공통 유틸 ---------- */
const $ = (s, el = document) => el.querySelector(s);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('cgb_' + k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('cgb_' + k, JSON.stringify(v)); } catch {} },
};
// lowerIsBetter: 반응속도/짝맞추기처럼 작을수록 좋은 기록
function saveBest(id, score, lowerIsBetter = false) {
  const prev = store.get(id);
  const better = prev == null || (lowerIsBetter ? score < prev : score > prev);
  if (better) store.set(id, score);
  return better;
}
function setHud(html) { $('#hud').innerHTML = html; }
function overlay(stage, title, text, btnLabel, onClick) {
  const o = document.createElement('div');
  o.className = 'overlay';
  o.innerHTML = `<h3>${title}</h3><p>${text}</p><button class="btn primary">${btnLabel}</button>`;
  o.querySelector('button').onclick = () => { o.remove(); onClick(); };
  stage.appendChild(o);
  return o;
}
function makeCanvas(stage, w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  stage.appendChild(c);
  return c;
}

/* ================= 게임 1: 꼬리잡기 뱀 ================= */
function snakeGame(stage) {
  const N = 20, S = 24;
  const c = makeCanvas(stage, N * S, N * S), ctx = c.getContext('2d');
  let snake, dir, nextDir, food, score, timer, speed, alive = false;

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 }; nextDir = dir;
    score = 0; speed = 130;
    placeFood(); alive = true; hud(); loop();
  }
  function placeFood() {
    do { food = { x: Math.random() * N | 0, y: Math.random() * N | 0 }; }
    while (snake.some(p => p.x === food.x && p.y === food.y));
  }
  function hud() { setHud(`점수 <b>${score}</b> · 최고 <b>${store.get('snake') ?? 0}</b>`); }
  function loop() { clearTimeout(timer); timer = setTimeout(step, speed); }
  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N || snake.some(p => p.x === head.x && p.y === head.y)) {
      alive = false; draw();
      const best = saveBest('snake', score);
      overlay(stage, '게임 오버', `점수 ${score}${best && score > 0 ? ' · 🎉 신기록!' : ''}`, '다시 하기', reset);
      return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++; speed = Math.max(60, speed - 3); placeFood(); hud();
    } else snake.pop();
    draw(); loop();
  }
  function draw() {
    ctx.fillStyle = '#120f0d'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = '#1c1815';
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if ((i + j) % 2) ctx.fillRect(i * S, j * S, S, S);
    ctx.font = `${S - 4}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🍊', food.x * S + S / 2, food.y * S + S / 2 + 1);
    snake.forEach((p, i) => {
      ctx.fillStyle = i === 0 ? '#e8a87c' : '#d97757';
      ctx.beginPath(); ctx.roundRect(p.x * S + 2, p.y * S + 2, S - 4, S - 4, 6); ctx.fill();
    });
  }
  function turn(x, y) { if (alive && (x !== -dir.x || y !== -dir.y)) nextDir = { x, y }; }
  const keys = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] };
  const onKey = e => { const k = keys[e.key]; if (k) { e.preventDefault(); turn(...k); } };
  let sx, sy;
  const onTS = e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; };
  const onTE = e => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx), 0) : turn(0, Math.sign(dy));
  };
  addEventListener('keydown', onKey);
  c.addEventListener('touchstart', onTS, { passive: true });
  c.addEventListener('touchend', onTE);

  snake = [{ x: 10, y: 10 }]; food = { x: 14, y: 10 }; draw(); hud();
  overlay(stage, '🐍 꼬리잡기 뱀', '귤을 먹을수록 길어지고 빨라져요.<br>벽이나 내 몸에 부딪히면 끝!', '시작', reset);
  return () => { clearTimeout(timer); removeEventListener('keydown', onKey); };
}

/* ================= 게임 2: 짝 맞추기 ================= */
function memoryGame(stage) {
  const pool = ['🍎', '🐱', '🚀', '🌈', '🎸', '🍩', '🐙', '⚡'];
  let first, lock, moves, matched, start, tick;
  const grid = document.createElement('div');
  grid.className = 'mem-grid';
  stage.appendChild(grid);

  function hud() {
    const t = start ? ((Date.now() - start) / 1000).toFixed(0) : 0;
    const best = store.get('memory');
    setHud(`시도 <b>${moves}</b> · ${t}초 · 최고 <b>${best ?? '-'}</b>회`);
  }
  function reset() {
    const cards = [...pool, ...pool].sort(() => Math.random() - .5);
    first = null; lock = false; moves = 0; matched = 0; start = 0;
    clearInterval(tick); tick = setInterval(hud, 500);
    grid.innerHTML = '';
    cards.forEach(e => {
      const b = document.createElement('button');
      b.className = 'mem-card';
      b.dataset.e = e;
      b.innerHTML = `<div class="b">✳</div><div class="f">${e}</div>`;
      b.onclick = () => flip(b);
      grid.appendChild(b);
    });
    hud();
  }
  function flip(b) {
    if (lock || b === first || b.classList.contains('open')) return;
    if (!start) start = Date.now();
    b.classList.add('open');
    if (!first) { first = b; return; }
    moves++;
    if (first.dataset.e === b.dataset.e) {
      first.classList.add('done'); b.classList.add('done');
      first = null; matched++;
      if (matched === pool.length) {
        clearInterval(tick); hud();
        const best = saveBest('memory', moves, true);
        setTimeout(() => overlay(stage, '🎉 클리어!', `${moves}번 만에 성공${best ? ' · 신기록!' : ''}`, '다시 하기', reset), 400);
      }
    } else {
      lock = true;
      const a = first; first = null;
      setTimeout(() => { a.classList.remove('open'); b.classList.remove('open'); lock = false; }, 700);
    }
    hud();
  }
  reset();
  return () => clearInterval(tick);
}

/* ================= 게임 3: 반응속도 ================= */
function reactionGame(stage) {
  const box = document.createElement('button');
  box.className = 'react-box';
  stage.appendChild(box);
  let state = 'idle', t0, timer, tries = [];

  function show(bg, title, sub) { box.style.background = bg; box.innerHTML = `${title}<small>${sub}</small>`; }
  function hud() {
    const avg = tries.length ? Math.round(tries.reduce((a, b) => a + b) / tries.length) : '-';
    setHud(`${tries.length}/5회 · 평균 <b>${avg}</b>ms · 최고 <b>${store.get('reaction') ?? '-'}</b>ms`);
  }
  function idle() { state = 'idle'; show('#3d5a80', '클릭해서 시작', '초록색으로 바뀌는 순간 클릭! (5회 평균)'); }
  function wait() {
    state = 'wait'; show('#b5483a', '기다리세요…', '초록색이 되면 클릭');
    timer = setTimeout(() => { state = 'go'; t0 = performance.now(); show('#3f9b5a', '지금!', ''); }, 1200 + Math.random() * 2800);
  }
  function press() {
    if (state === 'idle' || state === 'result') { if (tries.length >= 5) tries = []; hud(); wait(); }
    else if (state === 'wait') { clearTimeout(timer); state = 'result'; show('#6b4f3a', '너무 빨라요! 😅', '클릭해서 다시'); }
    else if (state === 'go') {
      const ms = Math.round(performance.now() - t0);
      tries.push(ms); hud(); state = 'result';
      if (tries.length >= 5) {
        const avg = Math.round(tries.reduce((a, b) => a + b) / 5);
        const best = saveBest('reaction', avg, true); hud();
        show('#2b2420', `평균 ${avg}ms ${best ? '🎉' : ''}`, `${best ? '신기록! · ' : ''}클릭해서 다시 도전`);
      } else show('#2b2420', `${ms}ms`, '클릭해서 다음 라운드');
    }
  }
  box.addEventListener('pointerdown', press);
  const onKey = e => { if (e.code === 'Space') { e.preventDefault(); press(); } };
  addEventListener('keydown', onKey);
  idle(); hud();
  return () => { clearTimeout(timer); removeEventListener('keydown', onKey); };
}

/* ================= 게임 4: 벽돌깨기 ================= */
function brickGame(stage) {
  const W = 480, H = 560;
  const c = makeCanvas(stage, W, H), ctx = c.getContext('2d');
  const COLS = 8, ROWS = 5, BW = 52, BH = 18, GAP = 6, TOP = 60;
  const colors = ['#e06c6c', '#e8a87c', '#d97757', '#7fbf7f', '#6fa8dc'];
  let paddle, ball, bricks, score, lives, level, raf, running = false, launched;

  function makeBricks() {
    bricks = [];
    const ox = (W - (COLS * BW + (COLS - 1) * GAP)) / 2;
    for (let r = 0; r < ROWS; r++) for (let col = 0; col < COLS; col++)
      bricks.push({ x: ox + col * (BW + GAP), y: TOP + r * (BH + GAP), alive: true, color: colors[r] });
  }
  function resetBall() {
    launched = false;
    ball = { x: paddle.x, y: H - 50, vx: 0, vy: 0, r: 7 };
  }
  function launch() {
    if (launched || !running) return;
    launched = true;
    const sp = 5 + level * .6;
    ball.vx = sp * (Math.random() > .5 ? .6 : -.6); ball.vy = -sp * .8;
  }
  function start() {
    paddle = { x: W / 2, w: 90 }; score = 0; lives = 3; level = 1;
    makeBricks(); resetBall(); running = true; hud(); cancelAnimationFrame(raf); frame();
  }
  function hud() { setHud(`점수 <b>${score}</b> · ❤️ ${lives} · 최고 <b>${store.get('brick') ?? 0}</b>`); }
  function frame() {
    update(); draw();
    if (running) raf = requestAnimationFrame(frame);
  }
  function update() {
    if (!launched) { ball.x = paddle.x; return; }
    ball.x += ball.vx; ball.y += ball.vy;
    if (ball.x < ball.r || ball.x > W - ball.r) { ball.vx *= -1; ball.x = Math.max(ball.r, Math.min(W - ball.r, ball.x)); }
    if (ball.y < ball.r) { ball.vy = Math.abs(ball.vy); }
    // 패들
    const py = H - 30;
    if (ball.vy > 0 && ball.y + ball.r >= py && ball.y + ball.r <= py + 14 && Math.abs(ball.x - paddle.x) < paddle.w / 2 + ball.r) {
      const hit = (ball.x - paddle.x) / (paddle.w / 2);
      const sp = Math.hypot(ball.vx, ball.vy);
      const ang = hit * Math.PI / 3;
      ball.vx = sp * Math.sin(ang); ball.vy = -sp * Math.cos(ang);
    }
    // 벽돌
    for (const b of bricks) {
      if (!b.alive) continue;
      if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + BW && ball.y + ball.r > b.y && ball.y - ball.r < b.y + BH) {
        b.alive = false; score += 10; hud();
        const overlapX = Math.min(ball.x + ball.r - b.x, b.x + BW - (ball.x - ball.r));
        const overlapY = Math.min(ball.y + ball.r - b.y, b.y + BH - (ball.y - ball.r));
        overlapX < overlapY ? ball.vx *= -1 : ball.vy *= -1;
        break;
      }
    }
    if (bricks.every(b => !b.alive)) { level++; makeBricks(); resetBall(); }
    if (ball.y > H + 20) {
      lives--; hud();
      if (lives <= 0) {
        running = false; draw();
        const best = saveBest('brick', score);
        overlay(stage, '게임 오버', `점수 ${score}${best && score > 0 ? ' · 🎉 신기록!' : ''}`, '다시 하기', start);
      } else resetBall();
    }
  }
  function draw() {
    ctx.fillStyle = '#120f0d'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#6f645b'; ctx.font = '14px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(`레벨 ${level}`, 14, 28);
    for (const b of bricks) if (b.alive) {
      ctx.fillStyle = b.color; ctx.beginPath(); ctx.roundRect(b.x, b.y, BW, BH, 5); ctx.fill();
    }
    ctx.fillStyle = '#f4ede6';
    ctx.beginPath(); ctx.roundRect(paddle.x - paddle.w / 2, H - 30, paddle.w, 12, 6); ctx.fill();
    ctx.fillStyle = '#e8a87c';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
    if (running && !launched) {
      ctx.fillStyle = '#a99d92'; ctx.textAlign = 'center'; ctx.font = '16px sans-serif';
      ctx.fillText('클릭 / 탭 / 스페이스로 발사', W / 2, H / 2 + 60);
    }
  }
  function movePaddle(clientX) {
    const r = c.getBoundingClientRect();
    paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, (clientX - r.left) / r.width * W));
  }
  const onMove = e => { if (paddle) movePaddle(e.clientX); };
  const onTouch = e => { if (paddle) { e.preventDefault(); movePaddle(e.touches[0].clientX); } };
  const keysDown = {};
  const onKey = e => {
    if (e.code === 'Space') { e.preventDefault(); launch(); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); keysDown[e.key] = e.type === 'keydown'; }
  };
  const keyLoop = setInterval(() => {
    if (!paddle) return;
    if (keysDown.ArrowLeft) paddle.x = Math.max(paddle.w / 2, paddle.x - 9);
    if (keysDown.ArrowRight) paddle.x = Math.min(W - paddle.w / 2, paddle.x + 9);
  }, 16);
  c.addEventListener('pointermove', onMove);
  c.addEventListener('touchmove', onTouch, { passive: false });
  c.addEventListener('pointerdown', e => { movePaddle(e.clientX); launch(); });
  addEventListener('keydown', onKey); addEventListener('keyup', onKey);

  paddle = { x: W / 2, w: 90 }; level = 1; makeBricks(); resetBall(); draw();
  setHud(`최고 <b>${store.get('brick') ?? 0}</b>`);
  overlay(stage, '🧱 벽돌깨기', '마우스·손가락·방향키로 패들을 움직여<br>공을 튕겨 벽돌을 모두 깨세요!', '시작', start);
  return () => { cancelAnimationFrame(raf); clearInterval(keyLoop); removeEventListener('keydown', onKey); removeEventListener('keyup', onKey); };
}

/* ================= 게임 5: 두더지 잡기 ================= */
function moleGame(stage) {
  const grid = document.createElement('div');
  grid.className = 'mole-grid';
  stage.appendChild(grid);
  const holes = [];
  for (let i = 0; i < 9; i++) {
    const h = document.createElement('button');
    h.className = 'hole';
    h.innerHTML = '<span>🐹</span>';
    h.addEventListener('pointerdown', () => whack(i));
    grid.appendChild(h); holes.push({ el: h, up: false, bomb: false, t: null });
  }
  let score = 0, timeLeft = 30, playing = false, spawnT, clockT;

  function hud() { setHud(`점수 <b>${score}</b> · ⏱ ${timeLeft}초 · 최고 <b>${store.get('mole') ?? 0}</b>`); }
  function start() {
    score = 0; timeLeft = 30; playing = true; hud();
    clockT = setInterval(() => { timeLeft--; hud(); if (timeLeft <= 0) end(); }, 1000);
    spawn();
  }
  function spawn() {
    if (!playing) return;
    const free = holes.filter(h => !h.up);
    if (free.length) {
      const h = free[Math.random() * free.length | 0];
      h.bomb = Math.random() < .18;
      h.el.querySelector('span').textContent = h.bomb ? '💣' : '🐹';
      h.up = true; h.el.classList.add('up');
      const stay = Math.max(450, 1100 - (30 - timeLeft) * 20);
      h.t = setTimeout(() => hide(h), stay);
    }
    spawnT = setTimeout(spawn, Math.max(350, 800 - (30 - timeLeft) * 15));
  }
  function hide(h) { h.up = false; h.el.classList.remove('up'); clearTimeout(h.t); }
  function whack(i) {
    const h = holes[i];
    if (!playing || !h.up) return;
    if (h.bomb) { score = Math.max(0, score - 3); h.el.querySelector('span').textContent = '💥'; }
    else { score++; h.el.querySelector('span').textContent = '😵'; }
    hud(); h.up = false; clearTimeout(h.t);
    setTimeout(() => h.el.classList.remove('up'), 150);
  }
  function end() {
    playing = false; clearInterval(clockT); clearTimeout(spawnT); holes.forEach(hide);
    const best = saveBest('mole', score);
    overlay(stage, '⏰ 시간 끝!', `점수 ${score}${best && score > 0 ? ' · 🎉 신기록!' : ''}`, '다시 하기', start);
  }
  hud();
  overlay(stage, '🐹 두더지 잡기', '30초 동안 튀어나오는 햄스터를 잡으세요!<br>💣 폭탄을 누르면 -3점', '시작', start);
  return () => { playing = false; clearInterval(clockT); clearTimeout(spawnT); holes.forEach(h => clearTimeout(h.t)); };
}

let cleanup = null;
function renderHome() {
  $('#grid').innerHTML = GAMES.map(g => {
    if (g.url) return `<a class="card" href="${g.url}" target="_blank" rel="noopener">
      <div class="emoji">${g.emoji}</div>
      <h2>${g.name}</h2>
      <p>${g.desc}</p>
      <div class="best">${g.tag}</div>
    </a>`;
    const b = store.get(g.id);
    return `<button class="card" data-id="${g.id}">
      <div class="emoji">${g.emoji}</div>
      <h2>${g.name}</h2>
      <p>${g.desc}</p>
      <div class="best">${b != null ? '🏆 ' + g.best(b) : '아직 기록 없음'}</div>
    </button>`;
  }).join('');
  document.querySelectorAll('button.card').forEach(el => el.onclick = () => location.hash = el.dataset.id);
}
function route() {
  if (cleanup) { cleanup(); cleanup = null; }
  const g = GAMES.find(g => g.id === location.hash.slice(1) && g.run);
  const stage = $('#stage');
  stage.innerHTML = ''; setHud('');
  if (!g) { document.body.classList.remove('playing'); renderHome(); return; }
  document.body.classList.add('playing');
  $('#game-title').textContent = `${g.emoji} ${g.name}`;
  $('#help').textContent = g.help;
  cleanup = g.run(stage);
  scrollTo(0, 0);
}
$('#back').onclick = () => location.hash = '';
addEventListener('hashchange', route);
route();
