<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#241813">
<title>추억 수리점</title>
<meta name="description" content="먼지 쌓인 옛날 게임팩·MP3·알 키우기 키링을 닦고 고쳐 진열장에 모으는 힐링 복원 게임">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* 무드: 밤늦게 불 켜진 동네 수리점. 나무 진열장, 크림색 벽, 초록 커팅 매트 */
  :root {
    color-scheme: dark;
    --bg: #241813;
    --bg2: #1a110d;
    --wood: #8a5636;
    --wood2: #6e4128;
    --plank: #a26a43;
    --cream: #fff3dd;
    --ink: #3b2418;
    --sub: #c9ab8f;
    --mint: #7fd6c2;
    --coral: #ff8f6b;
    --mustard: #f6c45a;
    --wall: #f1dfc0;
    --disp: "Jua", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    --hand: "Nanum Pen Script", "Jua", cursive;
    --body: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    --st: env(safe-area-inset-top, 0px);
    --sb: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; }
  body {
    color: var(--cream); font-family: var(--body); word-break: keep-all;
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  button:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }
  .hidden { display: none !important; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* ---------- 공통 상단바 ---------- */
  .top {
    display: flex; align-items: center; gap: 10px;
    padding: calc(10px + var(--st)) 14px 10px;
  }
  .logo { font-family: var(--disp); font-size: 25px; color: var(--mustard); letter-spacing: -.01em; text-shadow: 0 2px 0 #00000055; flex: 1; }
  .logo small { font-size: 13px; color: var(--sub); margin-left: 6px; }
  .pill { font-family: var(--disp); font-size: 16px; padding: 6px 12px; border-radius: 999px; background: #3a271d; border: 1px solid #ffffff1a; white-space: nowrap; }
  .ibtn { width: 40px; height: 40px; border-radius: 12px; background: #3a271d; border: 1px solid #ffffff1a; font-size: 18px; display: grid; place-items: center; flex: none; }
  .ibtn:active { transform: scale(.94); }

  /* ---------- 가게(홈) ---------- */
  .room {
    flex: 1; position: relative; margin: 0 10px; border-radius: 20px 20px 0 0; overflow: hidden;
    background: var(--wall); display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    box-shadow: inset 0 -40px 60px rgba(60, 30, 10, .18), inset 0 30px 50px rgba(60, 30, 10, .12);
    min-height: 0;
  }
  .room[data-wall="mint"] { --wall: #cfe6d8; }
  .room[data-wall="lav"] { --wall: #ded5ee; }
  .room[data-wall="check"] {
    --wall: #f3e6cc;
    background-image: repeating-conic-gradient(#e9cfa3 0 25%, #f6ead2 0 50%);
    background-size: 44px 44px;
  }
  .room::after { /* 무드등 빛 */
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .6s;
    background: radial-gradient(70% 50% at 50% 6%, rgba(255, 200, 110, .45), transparent 70%);
    mix-blend-mode: soft-light;
  }
  .room.lamp::after { opacity: 1; }
  .dec { position: absolute; pointer-events: none; transition: opacity .3s, transform .3s; }
  .dec.off { opacity: 0; transform: translateY(6px); }
  .dec-lamp { top: 0; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
  .dec-lamp .cord { width: 2px; height: 22px; background: #5a3a28; }
  .dec-lamp .shade { width: 54px; height: 26px; border-radius: 30px 30px 6px 6px; background: linear-gradient(#ffcf7a, #e89a3c); box-shadow: 0 10px 30px 8px rgba(255, 196, 100, .55); }
  .dec-lamp.off { transform: translateX(-50%) translateY(-6px); }
  .dec-poster {
    top: 34px; left: 14px; width: 78px; padding: 8px 6px 6px; background: #2b3a8a; color: #ffe27a; border-radius: 4px;
    transform: rotate(-5deg); box-shadow: 0 6px 14px rgba(0, 0, 0, .25); text-align: center; font-family: var(--disp); font-size: 12px; line-height: 1.25;
  }
  .dec-poster b { display: block; font-size: 22px; line-height: 1.1; }
  .dec-poster::before { content: ""; position: absolute; top: -5px; left: 50%; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: #e44; box-shadow: 0 2px 2px #0005; }
  .dec-poster.off { transform: rotate(-5deg) translateY(6px); }

  .cabinet {
    position: relative; width: min(94%, 430px); margin-bottom: -1px; z-index: 1;
    background: linear-gradient(180deg, #96603d, var(--wood2));
    border-radius: 16px 16px 4px 4px; padding: 12px 12px 10px;
    box-shadow: 0 16px 34px rgba(40, 20, 8, .45), inset 0 2px 0 rgba(255, 255, 255, .18), inset 0 -3px 0 rgba(0, 0, 0, .2);
  }
  .cabinet::before { /* 상판 */
    content: ""; position: absolute; left: -8px; right: -8px; top: -10px; height: 14px; border-radius: 6px;
    background: linear-gradient(#b67b52, #8a5636); box-shadow: 0 3px 6px rgba(0, 0, 0, .25);
  }
  .cab-in {
    position: relative; display: grid; grid-template-columns: repeat(3, 1fr);
    background: linear-gradient(180deg, #3d261a, #2a1a11); border-radius: 8px; padding: 6px 6px 0; overflow: hidden;
    box-shadow: inset 0 6px 16px rgba(0, 0, 0, .55);
  }
  .cab-in::after { /* 유리 반사 */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, rgba(255, 255, 255, .13) 0 14%, transparent 14% 38%, rgba(255, 255, 255, .07) 38% 43%, transparent 43%);
  }
  .slot {
    position: relative; aspect-ratio: 4 / 4.4; padding: 6px 4px 2px; border-bottom: 9px solid var(--plank);
    box-shadow: 0 6px 6px -4px rgba(0, 0, 0, .5); display: grid; place-items: center;
  }
  .slot canvas { width: 100%; height: 100%; display: block; filter: drop-shadow(0 4px 4px rgba(0, 0, 0, .45)); transition: transform .2s; }
  .slot:active canvas { transform: scale(.95); }
  .slot.empty::before {
    content: ""; position: absolute; inset: 12px 12px 8px; border: 2px dashed rgba(255, 255, 255, .1); border-radius: 10px;
  }
  .slot.target::before { border-color: var(--mustard); background: rgba(246, 196, 90, .12); animation: pulse 1.1s ease-in-out infinite; }
  .slot.new canvas { animation: placed .6s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes pulse { 50% { background: rgba(246, 196, 90, .28); } }
  @keyframes placed { from { transform: translateY(-30px) scale(.6); opacity: 0; } }

  .counter {
    position: relative; width: 100%; height: 118px; flex: none; z-index: 2;
    background: linear-gradient(180deg, #a26a43, #7a4a2e 40%, #5f3822);
    border-top: 10px solid #c08756; box-shadow: 0 -6px 14px rgba(40, 20, 8, .3);
    display: flex; align-items: center; justify-content: center;
  }
  .counter .msg { font-family: var(--disp); font-size: 15px; color: #ffe9c9; opacity: .85; text-align: center; padding: 0 90px; line-height: 1.4; }
  .on-counter { position: absolute; bottom: 100%; margin-bottom: 0; font-size: 34px; line-height: 1; filter: drop-shadow(0 4px 3px rgba(0, 0, 0, .35)); }
  .dec-cat { left: 12px; font-size: 38px; }
  .dec-radio { right: 14px; }
  .dec-plant { right: 58px; font-size: 40px; }

  .parcel { position: relative; width: 108px; height: 80px; animation: hop 1.6s ease-in-out infinite; }
  .parcel .bx {
    position: absolute; inset: 0; border-radius: 6px;
    background: linear-gradient(180deg, #d9a86a, #b9834a); box-shadow: inset 0 -6px 0 rgba(0, 0, 0, .12), 0 8px 14px rgba(0, 0, 0, .35);
  }
  .parcel .bx::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 22px; margin-left: -11px; background: rgba(240, 214, 160, .85); }
  .parcel .bx::after { content: ""; position: absolute; left: 10px; top: 12px; width: 30px; height: 20px; background: #fff8; border-radius: 2px; }
  .parcel .tag {
    position: absolute; top: -34px; left: 50%; transform: translateX(-50%); white-space: nowrap;
    background: var(--coral); color: #fff; font-family: var(--disp); font-size: 15px; padding: 5px 11px; border-radius: 999px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, .3);
  }
  .parcel .tag::after { content: ""; position: absolute; left: 50%; bottom: -5px; margin-left: -6px; border: 6px solid transparent; border-top-color: var(--coral); border-bottom: 0; }
  @keyframes hop { 0%, 70%, 100% { transform: translateY(0); } 80% { transform: translateY(-8px) rotate(-2deg); } 90% { transform: translateY(0) rotate(1deg); } }

  .banner {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 3; white-space: nowrap;
    background: var(--ink); color: var(--mustard); font-family: var(--disp); font-size: 16px; padding: 9px 16px; border-radius: 999px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, .35);
  }
  .nav { display: flex; gap: 8px; padding: 10px 10px calc(10px + var(--sb)); background: var(--bg2); }
  .nav button {
    flex: 1; padding: 12px 4px; border-radius: 14px; background: #3a271d; border: 1px solid #ffffff14;
    font-family: var(--disp); font-size: 16px; color: var(--cream);
  }
  .nav button:active { transform: scale(.96); }
  .nav button span { display: block; font-size: 22px; margin-bottom: 2px; }

  /* ---------- 택배 개봉 ---------- */
  #unbox { background: radial-gradient(80% 60% at 50% 40%, #6b4429, #2d1b12 75%); }
  .uwrap { flex: 1; display: grid; place-items: center; position: relative; overflow: hidden; }
  .box {
    position: relative; width: min(72vw, 290px); aspect-ratio: 1; perspective: 900px;
    touch-action: none;
  }
  .box .floor {
    position: absolute; inset: 0; border-radius: 6px; background: #a87445;
    box-shadow: inset 0 0 0 10px #b98450, inset 0 0 40px 18px rgba(0, 0, 0, .45), 0 24px 40px rgba(0, 0, 0, .5);
    display: grid; place-items: center; overflow: hidden;
  }
  .box .floor::before { /* 뽁뽁이 */
    content: ""; position: absolute; inset: 10px; opacity: .5;
    background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .55) 0 5px, rgba(255, 255, 255, .15) 6px 8px, transparent 9px) 0 0 / 22px 22px;
  }
  .box .floor canvas { position: relative; width: 78%; height: 78%; transform: translateY(14px) scale(.9); opacity: 0; transition: transform .7s cubic-bezier(.2, 1.4, .4, 1) .35s, opacity .4s .3s; }
  .box.open .floor canvas { transform: translateY(0) scale(1); opacity: 1; }
  .flap {
    position: absolute; top: 0; height: 100%; width: 50%;
    background: linear-gradient(135deg, #dcab6c, #c08a4f 60%, #b17b43);
    transition: transform .9s cubic-bezier(.3, .9, .3, 1); transform-style: preserve-3d;
    box-shadow: inset 0 0 0 1px rgba(90, 50, 20, .25);
  }
  .flap.l { left: 0; transform-origin: left center; border-radius: 6px 0 0 6px; }
  .flap.r { right: 0; transform-origin: right center; border-radius: 0 6px 6px 0; }
  .box.open .flap.l { transform: rotateY(-155deg); }
  .box.open .flap.r { transform: rotateY(155deg); }
  .flap .lbl {
    position: absolute; right: 12px; top: 20px; width: calc(100% - 52px); background: #fffdf6; color: #333; border-radius: 3px; padding: 7px 8px;
    font-family: var(--hand); font-size: 17px; line-height: 1.05; white-space: nowrap; overflow: hidden; box-shadow: 0 2px 4px rgba(0, 0, 0, .2);
  }
  .flap .lbl small { display: block; font-family: var(--body); font-size: 9px; color: #888; letter-spacing: .05em; }
  .flap .fragile { position: absolute; left: 14px; bottom: 18px; color: #c0392b; font-family: var(--disp); font-size: 14px; border: 2px solid #c0392b; padding: 2px 6px; transform: rotate(-8deg); opacity: .75; }
  .tape {
    position: absolute; left: 50%; top: -4px; bottom: -4px; width: 52px; margin-left: -26px; z-index: 2;
    background: repeating-linear-gradient(0deg, rgba(232, 205, 150, .95) 0 10px, rgba(222, 193, 136, .95) 10px 20px);
    box-shadow: 0 0 0 1px rgba(150, 110, 60, .25); transition: opacity .3s;
  }
  .cutline { position: absolute; left: 50%; width: 3px; margin-left: -1.5px; z-index: 3; background: #4a2a12; border-radius: 2px; box-shadow: 0 0 0 1px rgba(255, 255, 255, .3); }
  .box.cut .tape, .box.cut .cutline { opacity: 0; }
  .knife { position: absolute; z-index: 4; font-size: 34px; pointer-events: none; transform: translate(-30%, -70%) rotate(-20deg); transition: opacity .2s; }
  .uhint { text-align: center; font-family: var(--disp); font-size: 18px; color: #ffe9c9; padding: 14px 20px calc(24px + var(--sb)); min-height: 70px; }
  .letter {
    position: absolute; left: 50%; bottom: calc(16px + var(--sb)); width: min(92vw, 400px); transform: translate(-50%, 120%);
    background: #fffaf0; color: var(--ink); border-radius: 10px; padding: 20px 20px 18px; z-index: 5;
    background-image: repeating-linear-gradient(180deg, transparent 0 33px, #e8dcc6 33px 34px);
    background-position: 0 12px; box-shadow: 0 20px 50px rgba(0, 0, 0, .55);
    transition: transform .6s cubic-bezier(.2, 1.1, .3, 1);
  }
  .letter.show { transform: translate(-50%, 0); }
  .letter .who { font-family: var(--disp); font-size: 14px; color: #a0745a; margin-bottom: 4px; }
  .letter .who b { color: var(--ink); font-weight: normal; font-size: 18px; }
  .letter p { font-family: var(--hand); font-size: 23px; line-height: 34px; }
  .letter .sig { text-align: right; font-family: var(--hand); font-size: 22px; color: #6b4a36; }

  .cta {
    display: block; width: 100%; margin-top: 14px; padding: 15px; border-radius: 16px;
    background: linear-gradient(180deg, #ffb07a, var(--coral)); color: #fff; font-family: var(--disp); font-size: 20px;
    box-shadow: 0 5px 0 #c9603f, 0 10px 18px rgba(201, 96, 63, .35);
  }
  .cta:active { transform: translateY(3px); box-shadow: 0 2px 0 #c9603f; }
  .cta.sub { background: #efe3cf; color: var(--ink); box-shadow: 0 4px 0 #cdbb9d; }

  /* ---------- 작업대 ---------- */
  #bench { background: #4a2e1e; }
  #bench .top { background: linear-gradient(#2a1a12, #3a2419); }
  .btitle { flex: 1; min-width: 0; }
  .btitle b { display: block; font-family: var(--disp); font-size: 19px; font-weight: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chips { display: flex; gap: 5px; margin-top: 3px; }
  .chip { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; background: #ffffff12; opacity: .55; transition: all .25s; }
  .chip.now { background: var(--mustard); opacity: 1; transform: scale(1.15); box-shadow: 0 0 0 3px #f6c45a44; }
  .chip.ok { background: var(--mint); opacity: 1; font-size: 12px; }
  .stage {
    flex: 1; position: relative; overflow: hidden; touch-action: none; min-height: 0;
    margin: 0 8px calc(8px + var(--sb)); border-radius: 18px;
    background:
      linear-gradient(rgba(255, 255, 255, .07) 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(90deg, rgba(255, 255, 255, .07) 1px, transparent 1px) 0 0 / 24px 24px,
      radial-gradient(90% 70% at 50% 40%, #3a7d63, #285c48 80%);
    box-shadow: inset 0 0 0 3px #1f4a3a, inset 0 0 40px rgba(0, 0, 0, .35), 0 6px 14px rgba(0, 0, 0, .35);
  }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hint {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 3; max-width: calc(100% - 24px);
    background: rgba(28, 18, 13, .82); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    border-radius: 999px; padding: 8px 16px; font-family: var(--disp); font-size: 16px; text-align: center; pointer-events: none;
    display: flex; align-items: center; gap: 10px; white-space: nowrap;
  }
  .hint .bar { width: 64px; height: 8px; border-radius: 9px; background: #ffffff22; overflow: hidden; flex: none; }
  .hint .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--mint), #bff5e6); border-radius: 9px; transition: width .15s; }
  .power {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 3;
    padding: 16px 30px; border-radius: 999px; font-family: var(--disp); font-size: 21px; color: #fff;
    background: linear-gradient(180deg, #ffb07a, var(--coral)); box-shadow: 0 5px 0 #c9603f, 0 0 0 6px rgba(255, 143, 107, .2), 0 12px 26px rgba(0, 0, 0, .4);
    animation: breathe 1.6s ease-in-out infinite; white-space: nowrap;
  }
  .power:active { transform: translateX(-50%) translateY(3px); box-shadow: 0 2px 0 #c9603f; }
  @keyframes breathe { 50% { box-shadow: 0 5px 0 #c9603f, 0 0 0 14px rgba(255, 143, 107, .12), 0 12px 26px rgba(0, 0, 0, .4); } }
  .toast {
    position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.6); z-index: 4; opacity: 0; pointer-events: none;
    font-family: var(--disp); font-size: 30px; color: #fff; text-shadow: 0 3px 0 #1f4a3a, 0 0 20px rgba(127, 214, 194, .8); white-space: nowrap;
    transition: transform .35s cubic-bezier(.2, 1.6, .4, 1), opacity .25s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* ---------- 시트(모달) ---------- */
  .sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(15, 8, 5, .6); animation: fade .2s; }
  .sheet.center { align-items: center; padding: 16px; }
  @keyframes fade { from { opacity: 0; } }
  .panel {
    width: 100%; max-width: 480px; max-height: 86vh; overflow: auto; background: var(--cream); color: var(--ink);
    border-radius: 24px 24px 0 0; padding: 20px 18px calc(18px + var(--sb)); animation: up .3s cubic-bezier(.2, 1, .3, 1);
  }
  .sheet.center .panel { border-radius: 24px; padding-bottom: 20px; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .panel h3 { font-family: var(--disp); font-size: 23px; font-weight: normal; margin-bottom: 4px; }
  .panel .desc { font-size: 14px; color: #8a6a55; margin-bottom: 14px; line-height: 1.5; }
  .row {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 11px 12px; border-radius: 14px;
    background: #fff; border: 1px solid #ecdcc2; margin-bottom: 8px; color: var(--ink);
  }
  .row:active { transform: scale(.98); }
  .row .ic { font-size: 26px; width: 34px; text-align: center; flex: none; }
  .row .ic canvas { width: 40px; height: 44px; display: block; }
  .row .nm { flex: 1; font-family: var(--disp); font-size: 17px; line-height: 1.25; }
  .row .nm small { display: block; font-family: var(--body); font-size: 12px; color: #9a7b65; }
  .row .st { font-family: var(--disp); font-size: 14px; padding: 5px 10px; border-radius: 999px; background: #f3e6cf; white-space: nowrap; }
  .row .st.on { background: var(--mint); color: #134a3c; }
  .row .st.buy { background: var(--mustard); }
  .row.locked { opacity: .55; }
  .done-card { text-align: center; }
  .stamp {
    display: inline-block; font-family: var(--disp); font-size: 26px; color: #d9472b; border: 4px solid #d9472b; border-radius: 12px;
    padding: 4px 16px; transform: rotate(-6deg); margin: 4px 0 10px; animation: stamp .45s cubic-bezier(.2, 1.8, .4, 1);
  }
  @keyframes stamp { from { transform: rotate(-6deg) scale(2.2); opacity: 0; } }
  .done-card canvas { width: 130px; height: 150px; display: block; margin: 0 auto 6px; }
  .done-card .reply { font-family: var(--hand); font-size: 25px; line-height: 1.25; color: var(--ink); margin: 8px 4px 2px; }
  .done-card .from { font-size: 13px; color: #9a7b65; }
  .reward { font-family: var(--disp); font-size: 22px; color: #c98a12; margin-top: 10px; }
  .detail-ic { width: 120px; height: 140px; display: block; margin: 0 auto 8px; }
  .quote { font-family: var(--hand); font-size: 22px; line-height: 1.25; background: #fff; border-radius: 12px; padding: 10px 14px; margin: 10px 0; border: 1px solid #ecdcc2; }
  .btnrow { display: flex; gap: 8px; }
  .btnrow .cta { margin-top: 10px; font-size: 17px; padding: 13px 8px; }
</style>
</head>
<body>

<!-- 가게 -->
<section id="home" class="screen">
  <div class="top">
    <div class="logo">추억 수리점<small id="count"></small></div>
    <div class="pill" id="pts">⭐ 0</div>
    <button class="ibtn" id="snd" aria-label="소리 켜기/끄기">🔊</button>
  </div>
  <div class="room" id="room">
